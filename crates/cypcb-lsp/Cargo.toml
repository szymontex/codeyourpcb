[package]
name = "cypcb-lsp"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Language Server Protocol implementation for CodeYourPCB"

[[bin]]
name = "cypcb-lsp"
path = "src/main.rs"

[features]
# The server was off by default, with a comment blaming proc-macro loading.
# Whatever that was, it is not true of this toolchain - and the cost of the
# exclusion was that `backend.rs` compiled nowhere and stopped compiling at
# all. It is on by default so the build keeps reading it.
default = ["server"]
server = ["dep:tower-lsp", "dep:tokio", "dep:dashmap", "dep:serde_json"]

[dependencies]
# Internal crates - always available for diagnostics/hover modules
cypcb-core = { path = "../cypcb-core" }
cypcb-parser = { path = "../cypcb-parser" }
cypcb-world = { path = "../cypcb-world", features = ["sync"] }
cypcb-drc = { path = "../cypcb-drc" }
cypcb-calc = { path = "../cypcb-calc" }

# External dependencies - always needed
miette.workspace = true
tracing.workspace = true

# Server-only dependencies (optional)
tower-lsp = { workspace = true, optional = true }
tokio = { workspace = true, optional = true }
dashmap = { workspace = true, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde_json.workspace = true
