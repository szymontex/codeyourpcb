[package]
name = "cypcb-render"
description = "WASM rendering bridge for CodeYourPCB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
# Native build. Same reader as the browser one; the difference left is what
# else a native binary links.
native = ["cypcb-parser/rust-parser", "cypcb-world/sync"]
# Browser build: the Rust reader, which needs none, so the engine parses
# `.cypcb` itself instead of being handed a snapshot the host parsed.
wasm = ["cypcb-parser/rust-parser", "cypcb-world/sync"]

[dependencies]
# Workspace dependencies
cypcb-core = { workspace = true }
miette = { workspace = true }
cypcb-parser = { workspace = true }
cypcb-world = { workspace = true, default-features = false }
cypcb-drc = { path = "../cypcb-drc" }
cypcb-autoroute = { path = "../cypcb-autoroute" }
# The browser has no filesystem, so the importer is used through its
# string entry point. It is here so a KiCad board can be opened in the
# viewer rather than only on the command line.
cypcb-kicad = { path = "../cypcb-kicad" }
cypcb-router = { path = "../cypcb-router" }
cypcb-rules = { path = "../cypcb-rules" }
cypcb-calc = { path = "../cypcb-calc" }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# WASM support
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"

# Fix for getrandom WASM compilation (required by bevy_ecs -> ahash and uuid)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# wasm-pack must not optimize the module; `viewer/build-wasm.sh` does.
#
# The module uses bulk memory and non-trapping float conversions, so a plain
# `-O` refuses it with `Fatal: error validating input`. Those flags can be
# given here - and were - but wasm-pack reads this section for its own three
# profile names only: building with `--profile wasm-release` ignores it and
# runs its default `-O`, which is exactly the failure above. Optimizing in the
# script instead means one place decides, whatever profile the build uses.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[package.metadata.wasm-pack.profile.wasm-release]
wasm-opt = false

[dev-dependencies]
# Test-only: proves the viewer and the Gerber get the same copper.
cypcb-export = { path = "../cypcb-export" }
serde_json = { workspace = true }
