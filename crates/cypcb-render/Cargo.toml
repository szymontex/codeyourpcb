[package]
name = "cypcb-render"
description = "WASM rendering bridge for CodeYourPCB"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[features]
default = ["native"]
# Native build with full parsing support
native = ["cypcb-parser/tree-sitter-parser", "cypcb-world/sync"]
# WASM build without tree-sitter (parsing done in JS)
wasm = []

[dependencies]
# Workspace dependencies
cypcb-core = { workspace = true }
cypcb-parser = { workspace = true, default-features = false }
cypcb-world = { workspace = true, default-features = false }
cypcb-drc = { path = "../cypcb-drc" }
cypcb-autoroute = { path = "../cypcb-autoroute" }
cypcb-router = { path = "../cypcb-router" }
cypcb-rules = { path = "../cypcb-rules" }

# Logging
tracing = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# WASM support
wasm-bindgen = { workspace = true }
serde-wasm-bindgen = { workspace = true }
console_error_panic_hook = "0.1"

# Fix for getrandom WASM compilation (required by bevy_ecs -> ahash and uuid)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

# wasm-pack configuration for size optimization
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
