[package]
name = "cypcb-kicad"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "KiCad file format import for CodeYourPCB"

[dependencies]
cypcb-core = { path = "../cypcb-core" }
cypcb-world = { path = "../cypcb-world", default-features = false }
cypcb-router = { path = "../cypcb-router" }
serde = { workspace = true }
kicad_parse_gen = "0.7"
symbolic_expressions = "0.4"
