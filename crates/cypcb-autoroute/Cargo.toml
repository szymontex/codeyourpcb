[package]
name = "cypcb-autoroute"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "A*-based PCB autorouter for CodeYourPCB"

[dependencies]
cypcb-core = { workspace = true }
cypcb-world = { path = "../cypcb-world", default-features = false }
cypcb-rules = { path = "../cypcb-rules" }
cypcb-router = { path = "../cypcb-router" }
cypcb-drc = { path = "../cypcb-drc" }
bevy_ecs = { workspace = true }
pathfinding = "4"
# The A* successor function returns its neighbours by value, once per node
# expansion - millions of times on a real board. On the heap that was a malloc
# and a free each; twelve entries live on the stack instead, which is one more
# than a four-layer board can produce (eight directions plus three layer
# changes).
smallvec = "1"
serde = { workspace = true }
tracing = { workspace = true }

# Fix for getrandom WASM compilation (required by bevy_ecs -> ahash)
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom_02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }

[dev-dependencies]
# Test-only: the benchmark fixtures are routed here, and the copper they get
# has to reach the fabrication files. Exporting them in this crate spends the
# routing time once instead of twice.
cypcb-export = { path = "../cypcb-export" }
cypcb-core = { workspace = true }
cypcb-drc = { path = "../cypcb-drc" }
cypcb-kicad = { path = "../cypcb-kicad" }
cypcb-parser = { workspace = true }
cypcb-router = { path = "../cypcb-router" }
cypcb-rules = { path = "../cypcb-rules" }
cypcb-world = { path = "../cypcb-world" }
serde_json = { workspace = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
