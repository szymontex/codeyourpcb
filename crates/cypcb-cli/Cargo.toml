[package]
name = "cypcb-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Command-line interface for CodeYourPCB"

[[bin]]
name = "cypcb"
path = "src/main.rs"

[dependencies]
cypcb-core = { path = "../cypcb-core" }
cypcb-kicad = { path = "../cypcb-kicad" }
cypcb-parser = { path = "../cypcb-parser" }
cypcb-world = { path = "../cypcb-world" }
cypcb-router = { path = "../cypcb-router" }
cypcb-autoroute = { path = "../cypcb-autoroute" }
cypcb-drc = { path = "../cypcb-drc" }
cypcb-rules = { path = "../cypcb-rules" }
cypcb-export = { path = "../cypcb-export" }
cypcb-watcher = { path = "../cypcb-watcher" }
cypcb-library = { path = "../cypcb-library" }
clap = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }
# The crates below this binary carry 76 `tracing` calls and nothing was
# listening to any of them.
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
# The stack whose four copper layers all answer differently. A test that builds
# its own is a test that cannot tell one layer from the next, which is how three
# index errors shipped.
cypcb-fixtures = { path = "../cypcb-fixtures" }
# The engine the browser runs, so one test can ask both paths the same board
# and compare what they found. The two have disagreed about row counts before.
cypcb-render = { path = "../cypcb-render" }
