[package]
name = "cypcb-world"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ECS-based board model for CodeYourPCB"

[features]
default = ["sync"]
# Enable AST-to-ECS synchronization.
#
# It works on `cypcb_parser::ast`, which every build of that crate has, so this
# used to pull in the tree-sitter parser for nothing - and that dependency is
# what kept the browser build from turning a parsed file into a board.
sync = []

[dependencies]
cypcb-core = { workspace = true }
cypcb-parser = { workspace = true }
bevy_ecs = { workspace = true }
rstar = { workspace = true }
serde = { workspace = true }
miette = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
cypcb-fixtures = { path = "../cypcb-fixtures" }
cypcb-calc = { path = "../cypcb-calc" }
