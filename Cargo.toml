[workspace]
members = ["crates/*", "src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-beta"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/codeyourpcb/codeyourpcb"

[workspace.dependencies]
# Core libraries
tree-sitter = "0.25"
# Note: multi_threaded feature disabled for WASM compatibility
bevy_ecs = { version = "0.15", default-features = false }
rstar = "0.12"
thiserror = "2.0"
miette = { version = "7.6", features = ["fancy", "derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Date/time
chrono = "0.4"

# CLI
clap = { version = "4.0", features = ["derive"] }

# File watching
notify = "7.0"
notify-debouncer-full = "0.4"

# WASM
wasm-bindgen = "0.2"
serde-wasm-bindgen = "0.6"

# Observability
tracing = "0.1"

# Internal crates
cypcb-core = { path = "crates/cypcb-core" }
cypcb-parser = { path = "crates/cypcb-parser" }
cypcb-world = { path = "crates/cypcb-world", default-features = false }
cypcb-rules = { path = "crates/cypcb-rules" }
cypcb-drc = { path = "crates/cypcb-drc" }
cypcb-calc = { path = "crates/cypcb-calc" }
cypcb-router = { path = "crates/cypcb-router" }
cypcb-lsp = { path = "crates/cypcb-lsp" }
cypcb-export = { path = "crates/cypcb-export" }
cypcb-platform = { path = "crates/cypcb-platform" }
cypcb-library = { path = "crates/cypcb-library" }
cypcb-autoroute = { path = "crates/cypcb-autoroute" }

# LSP (using fork for Rust 2024 compatibility)
tower-lsp = { package = "tower-lsp-f", version = "0.24" }
dashmap = "6"
tokio = { version = "1", features = ["full"] }

# The native release build optimizes for speed.
#
# It optimized for size until 2026-08-08, because one profile served two
# targets: a browser, where every byte is downloaded, and a command line, where
# the router is the whole point. `opt-level = "z"` costs the router a quarter
# of its wall clock - `cypcb route shift_driver.kicad_pcb --fast` measured
# 2753ms at "z" against 2070ms at 3, best of three runs each - and it cost it
# on every crate the search calls into: the board model, the geometry, the
# rule lookups, the spatial index. Only `cypcb-autoroute` and `pathfinding`
# were exempt, and a search that spends its time in `cypcb-world` and
# `cypcb-core` does not care that its own crate is fast.
#
# The browser keeps its size build under `wasm-release` below.
[profile.release]
opt-level = 3        # Speed: this is what the CLI and the desktop build with
lto = true           # Link-time optimization
codegen-units = 1    # Better optimization (slower compile)
panic = "abort"      # Smaller panic handler
strip = true         # Strip debug symbols

# What the browser downloads, built for size.
#
# `viewer/build-wasm.sh` passes `--profile wasm-release`. Measured on the same
# module: 1,134,175 bytes at "z" against 1,460,669 at 3, and 411,147 against
# 520,451 gzipped - 29% of the download for optimizations nobody in a browser
# asked for.
[profile.wasm-release]
inherits = "release"
opt-level = "z"

# The autorouter is the hot path on both targets, so it keeps its speed even
# in the size build. The note that used to sit here said this crate "is not in
# the WASM bundle"; `cypcb-render/Cargo.toml` has depended on it for as long as
# the browser has had a Route button.
[profile.wasm-release.package.cypcb-autoroute]
opt-level = 3

[profile.wasm-release.package.pathfinding]
opt-level = 3        # A* hot path - speed matters

# A release build that can be read by a profiler.
#
# `strip = true` above is why `callgrind_annotate` reported the router's
# hottest functions as `???:0x00000000001ccead`. Build with
# `cargo build --profile profiling` to get the same code with its symbols.
[profile.profiling]
inherits = "release"
debug = true
strip = false
